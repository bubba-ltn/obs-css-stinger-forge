name: Release
run-name: Release ${{ github.ref_name }}
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-project:
    name: Build Project
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read
  publish:
    name: Publish GitHub Release
    needs: build-project
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "OBS CSS Stinger Forge $GITHUB_REF_NAME" --generate-notes
